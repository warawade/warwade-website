.contact a{

    border-radius:6px;

    font-size:14px;
}

.call{ background:#28a745; }
.whatsapp{ background:#25D366; }

/* Responsive */
@media(max-width:900px){

    .grid-4{ grid-template-columns:repeat(2,1fr); }
}
@media(max-width:500px){

function loadTable(){
    const filter = document.getElementById("committeeFilter").value;
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    const filtered = filter==="all" ? members :
        members.filter(m => m.committee === filter);

    if(filtered.length === 0){
        tbody.innerHTML = "<tr><td colspan='5' align='center'>माहिती उपलब्ध नाही</td></tr>";
        return;
    }

    filtered.forEach(m => {
        tbody.innerHTML += `
        <tr>
            <td>${m.committee}</td>
            <td>${m.name}</td>
            <td>${m.post}</td>
            <td>
                <a href="tel:${m.mobile}" style="color:green;font-weight:bold;">
                    📞 ${m.mobile}
                </a>
            </td>
            <td>
                <a href="https://wa.me/91${m.mobile}" target="_blank"
                style="color:#25D366;font-weight:bold;">
                    💬 WhatsApp
                </a>
            </td>
        </tr>
        `;
    });
}

loadTable();
